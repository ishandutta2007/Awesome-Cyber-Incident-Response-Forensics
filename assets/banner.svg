<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filter for glowing elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .radar-beam {
      transform-origin: 1000px 200px;
      animation: rotateRadar 10s linear infinite;
    }
    .pulse-node {
      animation: pulse 2.5s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 8 4;
      animation: dashMove 20s linear infinite;
    }
    .floating-orb {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 8px; opacity: 0.9; }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes float {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-12px) scale(1.05); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Background Cyber Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="750" y1="0" x2="750" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1050" y1="0" x2="1050" y2="400" />
  </g>

  <!-- Dynamic Background Animated Orbs -->
  <g opacity="0.25">
    <circle class="floating-orb" cx="200" cy="120" r="140" fill="url(#cyan-glow)" filter="url(#glow)" />
    <circle class="floating-orb" cx="1020" cy="220" r="160" fill="url(#purple-glow)" filter="url(#glow)" style="animation-delay: -3s;" />
  </g>

  <!-- Dynamic Radar Sweep graphic in Background on the Right -->
  <g transform="translate(0, 0)" opacity="0.6">
    <circle cx="1000" cy="200" r="150" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="1000" cy="200" r="100" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.25" />
    <circle cx="1000" cy="200" r="50" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" />
    <line x1="850" y1="200" x2="1150" y2="200" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" />
    <line x1="1000" y1="50" x2="1000" y2="350" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2" />
    <g class="radar-beam">
      <path d="M 1000 200 L 1150 200 A 150 150 0 0 0 1106 94 Z" fill="url(#cyan-glow)" opacity="0.18" />
    </g>
    <!-- Pulsing target nodes -->
    <circle class="pulse-node" cx="950" cy="150" r="6" fill="#38bdf8" filter="url(#subtle-glow)" />
    <circle class="pulse-node" cx="1060" cy="240" r="5" fill="#ec4899" filter="url(#subtle-glow)" style="animation-delay: -1.2s;" />
    <circle class="pulse-node" cx="1020" cy="120" r="4" fill="#a855f7" filter="url(#subtle-glow)" style="animation-delay: -0.7s;" />
  </g>

  <!-- Dynamic Connected Network Lines -->
  <path class="wave-line" d="M 50 360 C 250 340, 350 380, 550 350 S 800 370, 1150 340" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4" />

  <!-- Shield Icon Frame -->
  <g transform="translate(80, 60)" filter="url(#subtle-glow)">
    <rect width="64" height="64" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <!-- SVG Shield -->
    <path d="M 32 16 L 46 22 V 34 C 46 43 40 50 32 53 C 24 50 18 43 18 34 V 22 Z" fill="none" stroke="url(#text-grad)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 28 34 L 31 37 L 37 30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Header Text -->
  <g transform="translate(160, 102)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#text-grad)" letter-spacing="-0.5">
      Awesome Cyber Incident Response &amp; Forensics
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(84, 150)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Top DFIR Retainers, Managed Detection &amp; Response (MDR) &amp; Open-Source Forensics
    </text>
  </g>

  <!-- Interactive / Feature Badges in Foreground -->
  <g transform="translate(84, 195)">
    <!-- Pill 1: Incident Response Retainers -->
    <rect x="0" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="17" r="5" fill="#38bdf8" />
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      DFIR Retainers
    </text>

    <!-- Pill 2: MDR Services -->
    <rect x="180" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="196" cy="17" r="5" fill="#818cf8" />
    <text x="208" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      MDR Platforms
    </text>

    <!-- Pill 3: Open-Source Toolkits -->
    <rect x="340" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="356" cy="17" r="5" fill="#c084fc" />
    <text x="368" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      Open-Source Toolkits
    </text>

    <!-- Pill 4: Live Threat Triage -->
    <rect x="535" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <circle cx="551" cy="17" r="5" fill="#34d399" />
    <text x="563" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      Live Digital Forensics
    </text>
  </g>

  <!-- Bottom Tagline / Meta -->
  <g transform="translate(84, 275)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      ⚡ Curated intelligence on SLAs, enterprise retainer pricing, free tiers, and active open-source repositories.
    </text>
  </g>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.7" />
</svg>
